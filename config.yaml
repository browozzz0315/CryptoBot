app:
  timezone: Asia/Taipei
  log_level: INFO

market:
  quote_currency: usd
  tracked_symbols:
    - BTC
    - ETH
  default_price_symbol: BTC

push:
  enabled: true
  interval_minutes: 180
  schedule_mode: interval
  cron_hours: []
  cron_minute: 0
  chat_id: null

storage:
  database_url: sqlite+aiosqlite:///./runtime/cryptobot.db

history:
  enabled: true
  sync_on_startup: false
  sync_interval_minutes: 360
  ohlc_days: 30

alerts:
  enabled: true
  check_interval_minutes: 1

screener:
  enabled: true
  symbols:
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - DOGE
    - ADA
    - TRX
    - AVAX
    - LINK
    - TON
    - DOT
    - MATIC
    - SUI
  top_n: 5

charts:
  enabled: true
  output_dir: runtime/charts
  default_limit: 60

radar:
  enabled: true
  schedule_enabled: true
  interval_minutes: 180
  schedule_mode: cron
  cron_hours: [6, 14, 22]
  cron_minute: 0
  symbols:
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - DOGE
    - ADA
    - TRX
    - AVAX
    - LINK
    - TON
    - DOT
    - MATIC
    - SUI
  heat_top_n: 8
  long_top_n: 5
  composite_top_n: 8
  ambush_top_n: 8
  sideways_lookback_candles: 30
  sideways_threshold_pct: 12.0

subscription_events:
  enabled: true
  check_interval_minutes: 3
  cooldown_minutes: 180
  no_event_summary_enabled: true
  no_event_summary_hours: [9, 18]
  no_event_summary_minute: 5
  history_limit: 80
  price_change_threshold_pct: 5.0
  short_term_breakout_threshold_pct: 2.5
  short_term_lookback_candles: 4
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  oi_surge_threshold_pct: 8.0
  price_flat_threshold_pct: 2.5
  funding_negative_threshold_pct: -0.015

api:
  coingecko:
    base_url: https://api.coingecko.com/api/v3
    plan: demo
  fear_greed:
    base_url: https://api.alternative.me
  binance_futures:
    base_url: https://fapi.binance.com
